services:
  - type: web
    name: raja-viveka-vardhan-portfolio
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npx tsx scripts/seed.ts
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/portfolio.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.11.0
